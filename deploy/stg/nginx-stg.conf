# Staging Nginx — DigitalOcean droplet (NOT production)
# Replace hostnames if you use different stg DNS.

upstream babybarn_stg_store { server 127.0.0.1:3000; }
upstream babybarn_stg_admin { server 127.0.0.1:3001; }
upstream babybarn_stg_api   { server 127.0.0.1:5000; }

server {
  listen 80;
  server_name stg.mybabybarn.com;

  client_max_body_size 25M;

  location / {
    proxy_pass http://babybarn_stg_store;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://babybarn_stg_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name admin.stg.mybabybarn.com;

  client_max_body_size 25M;

  location / {
    proxy_pass http://babybarn_stg_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name api.stg.mybabybarn.com;

  client_max_body_size 25M;

  location / {
    proxy_pass http://babybarn_stg_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
