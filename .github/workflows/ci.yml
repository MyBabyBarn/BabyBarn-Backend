name: CI

on:
  pull_request:
    branches: [master, fix/audit-wave6, fix/audit-wave7]
  push:
    branches: [master, fix/audit-wave6, fix/audit-wave7]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Run tests
        run: npm test
